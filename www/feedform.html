{{ $url := .PageUrl }}
<main>
    <section id="container" class="admin-list">
    <h2 class="feedListHeadline">Feed list</h2>
    {{ range .Feeds }}
    <section class="feedList admin-row">
        <div class="feedListNarrow" data-label="Name">
            {{.Name}}
        </div>
        <div class="feedListNarrow" data-label="Ticker">
            {{.Abbr}}
        </div>
        <div class="feedListWide" data-label="URL">
            {{.Url}}
        </div>
        <div class="feedListNarrow row-actions">
            <form method="post" action="{{$url}}">
                <input type="hidden" name="ID" value="{{.ID}}"><input type="hidden" name="action" value="delete">
                <input type="submit" value="Delete" class="btn btn-outline">
            </form>        
        </div>
    </section>
    {{ end}}
    <form method="post" action="{{$url}}" class="admin-form">
        <section class="feedList admin-row add-row">
            <div class="feedListNarrow">
                <label for="feed-name">Name</label>
                <input type="text" id="feed-name" name="name" size="12" maxlength="30" placeholder="NYT Homepage">
            </div>
            <div class="feedListNarrow">
                <label for="feed-abbr">Ticker</label>
                <input type="text" id="feed-abbr" name="abbr" size="5" maxlength="4" placeholder="NYT">
            </div>
            <div class="feedListWide">
                <label for="feed-url">URL</label>
                <input type="url" id="feed-url" name="url" size="30" maxlength="255" placeholder="https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml">
            </div>
            <div class="feedListNarrow row-actions">
                <input type="hidden" name="action" value="add">
                <input type="submit" value="Add" class="btn btn-primary">
            </div>        
        </section>
    </form>
    </section>
</main>
