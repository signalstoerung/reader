<main>
    <section id="container" class="admin-list">
        <h2 class="keywordHeadline">Keyword list</h2>
        {{ range . }}
        <section class="keywordList admin-row">
            <div data-label="Keyword">{{ .Text }}</div>
            <div data-label="Mode"><span class="keywordTag">{{ if eq .Mode "KeywordSuppress" }}Suppress{{else}}Highlight{{end}}</span></div>
            <div data-label="Comment">{{ .Annotation }}</div>
            <div class="row-actions">
                <form method="POST" action=".">
                    <input type="hidden" name="action" value="delete">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <input type="submit" value="Delete" class="btn btn-outline">
                </form>
            </div>
        </section>
        {{ end }}
        <form method="POST" action="." class="admin-form">
            <section class="keywordList admin-row add-row">
                <div><label for="keyword">Keyword</label><input type="text" id="keyword" name="keyword" placeholder="keyword" size="12"></div>
                <div>
                    <label for="mode">Mode</label>
                    <select id="mode" name="mode">
                        <option selected value="suppress">Suppress</option>
                        <option value="highlight">Highlight</option>
                    </select>
                </div>
                <div><label for="annotation">Comment</label><input type="text" id="annotation" name="annotation" placeholder="comment" size="12"></div>
                <div class="row-actions">
                    <input type="hidden" name="action" value="add">
                    <input type="submit" value="Submit" class="btn btn-primary">
                </div>
            </section>
        </form>
    </section>
</main>
