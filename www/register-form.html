<main>
	<section id="container" class="auth-panel">
		<h2>Registration</h2>
		{{ if .signupsOpen }}
		<p class="auth-copy">Create the first private account.</p>
		<form action="/register/" method="post" class="auth-form">
		  <div>
			<label for="userid">User ID</label>
			<input type="text" id="userid" name="userid" placeholder="user id">
		  </div>
		  <div>
			<label for="password">Password</label>
			<input type="password" id="password" name="password" placeholder="mysecretpassword">
		  </div>
		  <div>
			<input type="submit" class="btn btn-primary" value="Create account">
		  </div>
		</form>
		{{ else }}
		<p class="auth-message"><strong>Sorry, signups are closed.</strong></p>
		{{ end }}
		<p class="auth-secondary"><a href="/login/">Back to login</a></p>
	</section>
  </main>
