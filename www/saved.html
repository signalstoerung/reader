<main>
    <section id="container" class="saved-list">
        <h2>Saved stories</h2>
        {{ range . }}
            <article class="saved-item">
                <div class="saved-content">
                    <h3>{{.Title}}</h3>
                    <p class="attribution">{{.PublishedParsed.Format "Jan 02, 15:04"}} | {{.FeedAbbr}}</p>
                    <p>
                        {{.Description}}<br>
                        <a href="{{.Link}}" referrerpolicy="no-referrer" target="_blank" class="colorfulLink">Go to article</a>
                    </p>
                    <div class="item-actions">
                        <form action="/saved/" method="post">
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="itemId" value="{{.ID}}">
                            <input type="submit" value="Remove" class="btn btn-outline">
                        </form>
                    </div>
                </div>
            </article>
        {{ end }}
    </section>
  </main>
