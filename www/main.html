<main>
  {{ if .Message}}
  <div class="warning">{{.Message}}</div>
  {{ end }}
  <section id="topbar" class="toolbar" aria-label="Feed controls">
    <div id="feedSelector">
      <label for="feed">Feed</label>
      <select id="feed">
        <option selected value="">Filter by feed</option>
        {{ range .Feeds }}
        <option>{{.Abbr}}</option>
        {{end }}
        <option value="">Clear filter</option>
      </select>
    </div>
    <div class="search-control">
      <label for="searchTerms">Search</label>
      <input type="search" id="searchTerms" placeholder="search terms" value="{{.SearchTerms}}"/>
    </div>
    <button id="searchButton" class="btn btn-primary">Search</button>
  </section>
    <section id="container" class="ticker-list" aria-label="Headlines">
        {{range .Headlines }}
            <article class="ticker-item">
                <div class="headline {{.AlertClass}}">
                    <button type="button" class="headline-toggle">
                      <span class="headline-meta"><span class="headline-time">{{.Timestamp}}</span> <span class="headline-feed">{{.FeedAbbr}}</span></span>
                      <span class="headline-title">{{.Title}}</span>
                    </button>
                </div>
                <aside class="headline-preview">
                  {{if ne .BreakingNewsReason "N/A"}}<p class="breakingNewsReason">{{.BreakingNewsReason}}</p>{{end}}
                    <p>
                      {{.Preview}}<br>
                      <a href="{{.Link}}" referrerpolicy="no-referrer" target="_blank">Go to article</a> 
                      <!-- | <a href="/proxy/{{.Link}}" target="_blank">archive.is link</a> | <a href="/archiveorg/?url={{.Link}}" target="_blank">archive.org link</a> -->
                    </p>
                    <div class="headline-actions">
                      <button type="button" class="saveAction btn btn-outline" data-id="{{.ItemId}}">Save</button>
                      <button type="button" class="shareAction btn btn-outline" data-headline="{{.Title}}" data-link="{{.Link}}" data-preview="{{.Preview}}">Share</button>
                    </div>
                    <!-- <a href="http://webcache.googleusercontent.com/search?q=cache:{{.Link}}" target="_blank">Google Cache</a> -->
                </aside>
            </article>
        {{ end }}
        <section class="pagenav">
            {{if eq .Page 1}}<span class="btn btn-disabled">Previous</span>
            {{else}}<a href="{{.PrevPageLink}}" class="btn btn-primary">Previous</a>{{end}}
            <span class="pageNumber">Page {{.Page}}</span>
            {{if eq .NextPageLink ""}}<span class="btn btn-disabled">Next</span>
            {{else}}<a href="{{.NextPageLink}}" class="btn btn-primary">Next</a>{{end}}
        </section>
    </section>
    <div id="socketinfo"></div>
  </main>
<style>
#socketinfo {
	position: fixed;
	bottom: 1em;
	right: 1em;
	font-size: 70%;
}
</style>
  <script>
	const socketinfo = document.getElementById("socketinfo");
	function log(s) {
		socketinfo.innerHTML = s;
	}

    class NewsTicker {
        constructor() {
            this.container = document.getElementById("container");
            this.initWebSocket();
        }

        initWebSocket() {
            const ws = new WebSocket('wss://reader.unxpctd.xyz/newsticker/');
            log("Websocket initializing...");
	    ws.onopen = (e) => {
		    log("Listening...");
	    };
            ws.onmessage = (event) => {
                const headline = JSON.parse(event.data);
                console.log(headline);
                this.addHeadline(headline);
            };

            ws.onerror = (error) => {
		    log(`WebSocket error: ${error}`);
            };
		ws.onclose = (e) => {
			console.log(e);
			log(`Attempting to reconnect... ${e.reason}`);
			setTimeout(() => this.initWebSocket(), 5000);
		};
        }

        addHeadline(headline) {
          const newArticle = document.createElement("article")
          newArticle.className = "ticker-item";
          const published = new Date(headline.PublishedParsed);
          newArticle.innerHTML = `
          <div class="headline alert">
            <a class="headline-live" href="${headline.Link}" referrerpolicy="no-referrer" target="_blank">
              <span class="headline-meta"><span class="headline-time">${published.toLocaleTimeString("en-GB")}</span> <span class="headline-feed">${headline.FeedAbbr}</span></span>
              <span class="headline-title">${headline.Title}</span>
            </a>
          </div>`;
          if (container.firstChild) {
            container.insertBefore(newArticle, container.firstChild);
          } else {
            container.appendChild(newArticle);
          }
        }
      }


    // Initialize ticker
    const ticker = new NewsTicker();
</script>
  <script src="/static/js/main.js?v=20260605-5"></script>
  <script src="/static/js/redact.js?v=20260605-6"></script>
